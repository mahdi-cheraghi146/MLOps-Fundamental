# kind cluster for the course (single node is enough for 16GB laptops).
# Node image is passed by scripts/kind-up.sh (--image) from versions.env.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mlops
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      # Traefik NodePorts -> laptop ports (session 12)
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
      - containerPort: 30443
        hostPort: 8443
        listenAddress: "127.0.0.1"
